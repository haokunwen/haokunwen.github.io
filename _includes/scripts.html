{% include analytics.html %}
{% include /comments-providers/scripts.html %}


<script>
document.addEventListener('DOMContentLoaded', function () {
  var filters = document.querySelector('.hk-pub-filters');
  if (!filters) return;
  var pubs = Array.prototype.slice.call(document.querySelectorAll('.hk-publication'));

  function nearestHeading(pub) {
    var node = pub.previousElementSibling;
    while (node) {
      if (node.classList && node.classList.contains('hk-pub-year')) return node;
      node = node.previousElementSibling;
    }
    return null;
  }
  pubs.forEach(function (p) { p._heading = nearestHeading(p); });

  function apply(filter) {
    pubs.forEach(function (p) {
      p.style.display = filter === 'all' || p.dataset.pubType === filter ? '' : 'none';
    });
    Array.prototype.forEach.call(document.querySelectorAll('.hk-pub-year'), function (h) {
      var visible = pubs.some(function (p) {
        return p._heading === h && (filter === 'all' || p.dataset.pubType === filter);
      });
      h.style.display = visible ? '' : 'none';
    });
  }

  filters.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    filters.querySelectorAll('button[data-filter]').forEach(function (b) {
      b.classList.toggle('active', b === btn);
    });
    apply(btn.dataset.filter);
  });
  apply('all');
});
</script>
