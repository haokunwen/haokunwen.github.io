<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}
{% include /comments-providers/scripts.html %}


<script>
document.addEventListener('DOMContentLoaded', function () {
  var filters = document.querySelector('.hk-pub-filters');
  if (!filters) return;

  function getEntries() {
    return Array.prototype.slice.call(document.querySelectorAll('.archive details')).map(function (details) {
      var entry = details.nextElementSibling;
      if (!entry || !entry.classList.contains('pub-entry')) return null;
      var content = entry.querySelector('.pub-content');
      if (!content) return null;
      var tag = content.querySelector('.pub-tag');
      var type = tag && tag.classList.contains('tag-conf') ? 'conference' :
                 tag && tag.classList.contains('tag-journal') ? 'journal' :
                 tag && tag.classList.contains('tag-preprint') ? 'preprint' : 'other';
      return { details: details, entry: entry, type: type };
    }).filter(Boolean);
  }

  function refreshHeadings() {
    var headings = Array.prototype.slice.call(document.querySelectorAll('.archive .hk-pub-year'));
    headings.forEach(function (h) {
      var node = h.nextElementSibling;
      var visible = false;
      while (node && !(node.classList && node.classList.contains('hk-pub-year'))) {
        if (node.tagName === 'DETAILS' && node.style.display !== 'none') { visible = true; break; }
        node = node.nextElementSibling;
      }
      h.style.display = visible ? '' : 'none';
    });
  }

  filters.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    var wanted = btn.getAttribute('data-filter');
    Array.prototype.forEach.call(filters.querySelectorAll('button'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    getEntries().forEach(function (g) {
      var show = wanted === 'all' || g.type === wanted;
      g.details.style.display = show ? '' : 'none';
      g.entry.style.display = show ? '' : 'none';
    });
    refreshHeadings();
  });
});
</script>
