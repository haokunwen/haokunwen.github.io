<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}
{% include /comments-providers/scripts.html %}


<script>
document.addEventListener('DOMContentLoaded', function () {
  var filters = document.querySelector('.hk-pub-filters');
  if (!filters) return;
  var publications = Array.prototype.slice.call(document.querySelectorAll('.hk-publication'));
  var sections = Array.prototype.slice.call(document.querySelectorAll('.hk-pub-section'));

  function apply(filter) {
    publications.forEach(function (pub) {
      pub.hidden = !(filter === 'all' || pub.dataset.pubType === filter);
    });
    sections.forEach(function (section) {
      section.hidden = !Array.prototype.some.call(section.querySelectorAll('.hk-publication'), function (pub) {
        return !pub.hidden;
      });
    });
  }

  filters.addEventListener('click', function (event) {
    var button = event.target.closest('button[data-filter]');
    if (!button) return;
    Array.prototype.forEach.call(filters.querySelectorAll('button'), function (b) {
      b.classList.toggle('active', b === button);
    });
    apply(button.dataset.filter);
  });
});
</script>
