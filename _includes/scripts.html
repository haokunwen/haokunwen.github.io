<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}
{% include /comments-providers/scripts.html %}


<script>
document.addEventListener('DOMContentLoaded', function () {
  var filters = document.querySelector('.hk-pub-filters');
  if (!filters) return;

  function entries() {
    var out = [];
    var nodes = document.querySelectorAll('.archive details');
    Array.prototype.forEach.call(nodes, function (details) {
      var entry = details.nextElementSibling;
      if (!entry || !entry.classList.contains('pub-entry')) return;
      var tag = entry.querySelector('.pub-tag');
      var type = 'other';
      if (tag) {
        if (tag.classList.contains('tag-conf')) type = 'conference';
        else if (tag.classList.contains('tag-journal')) type = 'journal';
        else if (tag.classList.contains('tag-preprint')) type = 'preprint';
      }
      out.push({details: details, entry: entry, type: type});
    });
    return out;
  }

  function updateYears() {
    Array.prototype.forEach.call(document.querySelectorAll('.archive .hk-pub-year'), function (heading) {
      var node = heading.nextElementSibling;
      var hasVisible = false;
      while (node && !(node.classList && node.classList.contains('hk-pub-year'))) {
        if (node.tagName === 'DETAILS' && node.hidden === false) { hasVisible = true; break; }
        node = node.nextElementSibling;
      }
      heading.hidden = !hasVisible;
    });
  }

  filters.addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-filter]');
    if (!btn) return;
    var filter = btn.dataset.filter;
    Array.prototype.forEach.call(filters.querySelectorAll('button[data-filter]'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    entries().forEach(function (item) {
      var visible = filter === 'all' || item.type === filter;
      item.details.hidden = !visible;
      item.entry.hidden = !visible;
    });
    updateYears();
  });
});
</script>
