<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}
{% include /comments-providers/scripts.html %}


<script>
document.addEventListener('DOMContentLoaded', function () {
  var filters = document.querySelector('.hk-pub-filters');
  var archive = document.querySelector('.archive');
  if (!filters || !archive) return;

  function classify(entry) {
    var tag = entry.querySelector('.pub-tag');
    if (!tag) return 'other';
    if (tag.classList.contains('tag-preprint')) return 'preprint';
    if (tag.classList.contains('tag-journal')) return 'journal';
    if (tag.classList.contains('tag-conf')) return 'conference';
    return 'other';
  }

  function applyFilter(filter) {
    var children = Array.prototype.slice.call(archive.children);
    var currentHeading = null;
    var sections = [];

    children.forEach(function (node) {
      if (node.classList && node.classList.contains('hk-pub-year')) {
        currentHeading = node;
        sections.push({ heading: node, visibleCount: 0 });
        return;
      }
      if (node.tagName !== 'DETAILS') return;

      var entry = node.nextElementSibling;
      if (!entry || !entry.classList.contains('pub-entry')) return;

      var show = filter === 'all' || classify(entry) === filter;
      node.hidden = !show;
      entry.hidden = !show;

      if (show && sections.length) sections[sections.length - 1].visibleCount++;
    });

    sections.forEach(function (section) {
      section.heading.hidden = section.visibleCount === 0;
    });
  }

  filters.addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-filter]');
    if (!btn) return;
    Array.prototype.forEach.call(filters.querySelectorAll('button[data-filter]'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    applyFilter(btn.getAttribute('data-filter'));
  });

  applyFilter('all');
});
</script>
