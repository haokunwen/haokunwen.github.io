<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}
{% include /comments-providers/scripts.html %}


<script>
document.addEventListener('DOMContentLoaded', function () {
  var filters = document.querySelector('.hk-pub-filters');
  if (!filters) return;

  var entries = Array.prototype.slice.call(document.querySelectorAll('.pub-entry')).map(function (entry) {
    var tag = entry.querySelector('.pub-tag');
    var type = 'other';
    if (tag) {
      if (tag.classList.contains('tag-preprint')) type = 'preprint';
      else if (tag.classList.contains('tag-journal')) type = 'journal';
      else if (tag.classList.contains('tag-conf')) type = 'conference';
    }

    var details = entry.previousElementSibling;
    while (details && details.tagName !== 'DETAILS' && !(details.classList && details.classList.contains('hk-pub-year'))) {
      details = details.previousElementSibling;
    }
    if (!details || details.tagName !== 'DETAILS') details = null;
    return { entry: entry, details: details, type: type };
  });

  function updateHeadings() {
    var headings = Array.prototype.slice.call(document.querySelectorAll('.hk-pub-year'));
    headings.forEach(function (heading, i) {
      var nextHeading = headings[i + 1] || null;
      var visible = entries.some(function (item) {
        if (item.entry.hidden) return false;
        var afterStart = !!(heading.compareDocumentPosition(item.entry) & Node.DOCUMENT_POSITION_FOLLOWING);
        var beforeEnd = !nextHeading || !!(item.entry.compareDocumentPosition(nextHeading) & Node.DOCUMENT_POSITION_FOLLOWING);
        return afterStart && beforeEnd;
      });
      heading.hidden = !visible;
    });
  }

  function apply(filter) {
    entries.forEach(function (item) {
      var show = filter === 'all' || item.type === filter;
      item.entry.hidden = !show;
      if (item.details) item.details.hidden = !show;
    });
    updateHeadings();
  }

  filters.addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-filter]');
    if (!btn) return;
    Array.prototype.forEach.call(filters.querySelectorAll('button[data-filter]'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    apply(btn.getAttribute('data-filter'));
  });

  apply('all');
});
</script>
