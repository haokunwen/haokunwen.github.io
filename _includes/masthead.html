{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="hk-site-nav" class="hk-nav">
        <a class="hk-nav-brand" href="{{ base_path }}/">{{ site.title }}</a>
        <div class="hk-nav-links">
          <a href="{{ base_path }}/" class="{% if page.url == '/' %}active-tab{% endif %}">About</a>
          <a href="{{ base_path }}/publications/" class="{% if page.url == '/publications/' %}active-tab{% endif %}">Publications</a>
          <a href="{{ base_path }}/cv/" class="{% if page.url == '/cv/' %}active-tab{% endif %}">CV</a>
          <a href="{{ base_path }}/services/" class="{% if page.url == '/services/' %}active-tab{% endif %}">Services</a>
          <a href="{{ base_path }}/patents/" class="{% if page.url == '/patents/' %}active-tab{% endif %}">Patents</a>
        </div>
      </nav>
    </div>
  </div>
</div>
